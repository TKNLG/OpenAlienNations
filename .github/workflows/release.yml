# Release: push a tag "v<version>" (matching package.json) to build and publish
#   - OpenAlienNations-<version>-windows-x64.exe   single executable (Node SEA)
#   - OpenAlienNations-<version>-linux-x64.tar.gz  single executable (Node SEA) + LICENSE, NOTICE
#   - LICENSE.txt, NOTICE.txt                      license texts next to the downloads
#   - ghcr.io/<owner>/openaliennations:<version>   server image (Docker, with LICENSE and NOTICE)
# "Run workflow" (workflow_dispatch) on a branch builds everything as a dry run (downloadable
# workflow artifacts, image built but not pushed); run it on a tag to publish that tag, or on
# main with "publish" ticked to create the tag v<package.json version> and publish it.
#
# The builds contain our code, the client and the HD UI pack (hd/) only. Never game data:
# re/, ref/, out/, gamedata/ are not in the repository (.gitignore) and nothing reads them here.
# See docs/release.md.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish: create the tag v<package.json version> at this commit and release it'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Node LTS used to build and embedded in the executables. Pin an exact version (e.g. 24.11.1)
  # for byte-reproducible builds.
  NODE_VERSION: '24'
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: version
        name: Version (tag must match package.json)
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: No game data in the repository
        run: |
          bad=$(git ls-files | grep -Ei '^(re|ref|out|gamedata)/|\.(gd|os|dvm|mdb|odb|idb|od|tdb|dvf|wdb|gdb)$' || true)
          if [ -n "$bad" ]; then echo "::error::game files tracked:"; echo "$bad"; exit 1; fi
      - name: Build
        run: node build.mjs
      - name: Type-check
        run: npx --yes -p typescript@5.6.3 tsc -p .
      - name: Tests (the data-driven ones skip without game data)
        run: node --test --experimental-strip-types --no-warnings "test/**/*.test.ts"

  binaries:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build single executable
        run: node tools/sea/build-sea.mjs --name OpenAlienNations
      - name: Smoke test
        run: |
          exe=build/sea/OpenAlienNations
          [ "$RUNNER_OS" = "Windows" ] && exe=build/sea/OpenAlienNations.exe
          out=$("$exe" --version)
          echo "$out"
          [ "$out" = "$VERSION" ]
          "$exe" --help
      - name: Package
        run: |
          mkdir -p release
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/sea/OpenAlienNations.exe "release/OpenAlienNations-$VERSION-windows-x64.exe"
          else
            cp LICENSE NOTICE build/sea/
            tar -C build/sea -czf "release/OpenAlienNations-$VERSION-linux-x64.tar.gz" OpenAlienNations LICENSE NOTICE
          fi
          ls -l release
      - uses: actions/upload-artifact@v7
        with:
          name: OpenAlienNations-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  docker:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: image
        name: Image name (registry names must be lower-case)
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/openaliennations" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.check.outputs.version }},enable=${{ env.PUBLISH }}
            type=raw,value=latest,enable=${{ env.PUBLISH }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [check, binaries]   # not docker: a registry problem must not block the downloads
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            LICENSE
            NOTICE
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: OpenAlienNations-*
          merge-multiple: true
      - name: License texts next to the downloads
        run: |
          cp LICENSE release/LICENSE.txt
          cp NOTICE release/NOTICE.txt
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/openaliennations:$VERSION"
          cat > notes.md <<EOF
          **You need your own copy of Alien Nations** (GOG, or the CD / Gold Edition installed). These downloads contain no game files.

          - **Windows:** download \`OpenAlienNations-$VERSION-windows-x64.exe\` and run it. SmartScreen warns because the file is not signed: click *More info* -> *Run anyway*. Pick your game folder once; the game opens in your browser.
          - **Linux:** \`tar xzf OpenAlienNations-$VERSION-linux-x64.tar.gz && ./OpenAlienNations\`
          - **Server / NAS:** \`docker run -d -p 8080:8080 -v "/path/to/Alien Nations:/game:ro" $image\`

          Multiplayer: friends open the network address printed in the console window (LAN, or a VPN such as Tailscale / ZeroTier / Hamachi).

          License: GPL-3.0-or-later (\`LICENSE.txt\`); see \`NOTICE.txt\` for the game trademarks and the HD UI pack, which is not covered by the GPL.
          EOF
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OpenAlienNations $VERSION" \
            --notes-file notes.md \
            --generate-notes
